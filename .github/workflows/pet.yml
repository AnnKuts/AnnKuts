
name: Cat Symon

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: symon-profile
  cancel-in-progress: false

jobs:
  ginger-cat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Get YourTomo source
        run: git clone --depth 1 https://github.com/knowprasad/YourTomo.git /tmp/yourtomo

      - name: Customize Symon and fix statistics
        run: python3 scripts/customize_symon.py /tmp/yourtomo

      - name: Generate animated Symon
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PET_USER: AnnKuts
          PET_NAME: Anna
          PET_CAT_NAME: Symon
          PET_TZ_OFFSET_MINUTES: '120'
          PET_CONTACT: 'anjakuts@gmail.com'
          PET_ACCENT: '#F472B6'
          PET_OUTPUT_DIR: ${{ github.workspace }}/dist
          PET_ATTRIBUTION: 'true'
          PET_FORCE_STATE: ''
        run: bun /tmp/yourtomo/generate.ts

      - name: Save generated SVGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/
          if ! git diff --cached --quiet; then
            git commit -m 'Update Symon [skip ci]'
            git push
          fi